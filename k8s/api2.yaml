apiVersion: apps/v1
kind: Deployment
metadata:
  name: api2-deployment
  namespace: desafio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api2
  template:
    metadata:
      labels:
        app: api2
    spec:
      containers:
        - name: api2
          image: "localhost:5000/api2:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: api-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: POSTGRES_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: api2-service
  namespace: desafio
spec:
  type: NodePort
  selector:
    app: api2
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30002