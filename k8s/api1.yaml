apiVersion: apps/v1
kind: Deployment
metadata:
  name: api1-deployment
  namespace: desafio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api1
  template:
    metadata:
      labels:
        app: api1
    spec:
      containers:
        - name: api1
          image: "localhost:5000/api1:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: api-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: POSTGRES_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: api1-service
  namespace: desafio
spec:
  type: NodePort
  selector:
    app: api1
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30001